version: '3.8'
services:
  mast3r-cuda:
    image: mast3r-ign-cuda
    hostname: mast3r-ign-cuda-container
    network_mode: host
    entrypoint: ["bash"]
    build:
      context: ../
      dockerfile: docker/files/cuda.Dockerfile 
      network: host
      args:
        HTTP_PROXY: http://proxy.ign.fr:3128
        HTTPS_PROXY: http://proxy.ign.fr:3128
        NO_PROXY: localhost,127.0.0.1,*.ign.fr
        http_proxy: http://proxy.ign.fr:3128
        https_proxy: http://proxy.ign.fr:3128
        no_proxy: localhost,127.0.0.1,*.ign.fr
    environment:
      - DEVICE=cuda
      - HTTP_PROXY=http://proxy.ign.fr:3128
      - HTTPS_PROXY=http://proxy.ign.fr:3128
      - NO_PROXY=localhost,127.0.0.1,*.ign.fr
    volumes:
      - ../:/mast3r_ign
      - ../../../data/chantier_lilles/:/mast3r_ign/data/chantier_lilles
    devices:
      - /dev/dri:/dev/dri
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
    gpus: all
    # runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
